  <line x1="900" y1="555" x2="700" y2="600" stroke="#0D0D0D" stroke-width="1"/>
  <line x1="600" y1="600" x2="600" y2="625" stroke="#0D0D0D" stroke-width="1"/>
  <polygon points="595,625 605,625 600,635" fill="#0D0D0D"/>
