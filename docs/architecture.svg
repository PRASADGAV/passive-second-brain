  <text x="900" y="528" text-anchor="middle" font-size="9" fill="#666">Semantic similarity search</text>
  <text x="900" y="546" text-anchor="middle" font-size="9" fill="#666">RAG retrieval · 5-nearest neighbours</text>

  <!-- Combined arrow to frontend -->
