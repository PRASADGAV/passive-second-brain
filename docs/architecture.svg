  <text x="450" y="392" text-anchor="middle" font-size="8" fill="#666">resolver · rag · sm2</text>
  <text x="450" y="406" text-anchor="middle" font-size="8" fill="#666">scheduler · digest_gen</text>

  <line x1="560" y1="345" x2="560" y2="420" stroke="#CCC" stroke-width="0.5"/>

