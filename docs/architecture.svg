  <text x="600" y="660" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D0D0D" letter-spacing="2">REACT FRONTEND  (port 5173)</text>
  <line x1="80" y1="668" x2="1120" y2="668" stroke="#0D0D0D" stroke-width="0.5"/>

  <text x="185" y="688" text-anchor="middle" font-size="9" fill="#666">D3.js Graph</text>
  <text x="185" y="702" text-anchor="middle" font-size="8" fill="#888">3D Carousel + Floating Cards</text>

