<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="font-family: monospace; background: #FAFAF8;">

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#0D0D0D" letter-spacing="4">PASSIVE SECOND BRAIN — SYSTEM ARCHITECTURE</text>
  <line x1="100" y1="58" x2="1100" y2="58" stroke="#0D0D0D" stroke-width="1"/>

  <!-- Layer 1: Digital Life -->
  <rect x="80" y="80" width="1040" height="70" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  <text x="600" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D0D0D" letter-spacing="2">YOUR DIGITAL LIFE</text>
  <text x="600" y="130" text-anchor="middle" font-size="10" fill="#666">Browser: Articles · YouTube Videos · Online PDFs    |    Desktop: Local PDFs · Voice Notes · Text Files</text>

  <!-- Arrow down -->
  <line x1="600" y1="150" x2="600" y2="175" stroke="#0D0D0D" stroke-width="1"/>
  <polygon points="595,175 605,175 600,185" fill="#0D0D0D"/>
  <text x="620" y="168" font-size="9" fill="#666">passive capture (stored locally)</text>

  <!-- Layer 2: Chrome Extension -->
  <rect x="80" y="185" width="490" height="80" fill="none" stroke="#0D0D0D" stroke-width="1"/>
  <text x="325" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D0D0D" letter-spacing="2">CHROME EXTENSION MV3</text>
  <text x="325" y="230" text-anchor="middle" font-size="9" fill="#666">content.js — 60s reading timer · YT 50% trigger</text>
  <text x="325" y="248" text-anchor="middle" font-size="9" fill="#666">background.js — service worker · queue · domain filter</text>

