  <text x="875" y="230" text-anchor="middle" font-size="9" fill="#666">desktop_agent.py — watchdog PDF watcher</text>
  <text x="875" y="248" text-anchor="middle" font-size="9" fill="#666">monitors ~/Documents/PSB-inbox/ for new PDFs</text>

  <!-- Arrow down -->
  <line x1="600" y1="265" x2="600" y2="295" stroke="#0D0D0D" stroke-width="1"/>
  <polygon points="595,295 605,295 600,305" fill="#0D0D0D"/>
