  <text x="710" y="688" text-anchor="middle" font-size="9" fill="#666">Gap Detector</text>
  <text x="710" y="702" text-anchor="middle" font-size="8" fill="#888">JD vs knowledge graph</text>

  <text x="885" y="688" text-anchor="middle" font-size="9" fill="#666">Privacy Controls</text>
