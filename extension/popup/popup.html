<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENGRAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 300px;
      background: #0a0a12;
      color: #e2e8f0;
      padding: 14px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #818cf8;
    }
    .header .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 1.4s infinite;
    }
    .header .dot.paused { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.7); }
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12121e;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .status-label { font-size: 10px; color: #64748b; letter-spacing: .08em; text-transform: uppercase; }
    .status-value { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .status-value.active  { color: #22c55e; }
    .status-value.paused  { color: #ef4444; }
    .toggle-btn {
      background: #818cf8;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      letter-spacing: .06em;
      transition: background .15s;
    }
    .toggle-btn:hover { background: #6366f1; }
    .toggle-btn.paused { background: #334155; }
    .toggle-btn.paused:hover { background: #475569; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .stat-card {
      background: #12121e;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .stat-card .label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing:.08em; }
    .stat-card .value { font-size: 18px; font-weight: 700; color: #38bdf8; line-height: 1.2; margin-top: 2px; }
    /* Recent captures log */
    .section-title {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #475569;
      margin: 10px 0 5px;
    }
    .capture-log {
      background: #12121e;
      border: 1px solid #1e1e2e;
      border-radius: 6px;
      overflow: hidden;
    }
    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid #1a1a28;
      font-size: 10px;
    }
    .log-item:last-child { border-bottom: none; }
    .log-item .type-badge {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .type-url  { background: rgba(56,189,248,.15); color: #38bdf8; }
    .type-yt   { background: rgba(239,68,68,.15);  color: #ef4444; }
    .type-desk { background: rgba(52,211,153,.15);  color: #34d399; }
    .log-item .log-text {
      flex: 1;
      color: #94a3b8;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .log-item .log-time { font-size: 8px; color: #334155; flex-shrink: 0; }
    .log-empty { padding: 12px 10px; text-align: center; color: #334155; font-size: 10px; }
    /* Settings */
    .settings-toggle {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 10px;
      padding: 6px 0 2px;
      letter-spacing: .06em;
      width: 100%;
      text-align: left;
    }
    .settings-toggle:hover { color: #94a3b8; }
    .settings-panel { display: none; }
    .settings-panel.open { display: block; }
    .settings-panel label {
      display: block;
      font-size: 9px;
      color: #64748b;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin: 8px 0 3px;
    }
    .settings-panel input {
      width: 100%;
      background: #12121e;
      border: 1px solid #1e1e2e;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 11px;
      padding: 6px 8px;
      outline: none;
    }
    .settings-panel input:focus { border-color: #818cf8; }
    .save-btn {
      width: 100%;
      margin-top: 8px;
      background: #1e1e2e;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      padding: 7px 0;
      letter-spacing: .08em;
      transition: background .15s;
    }
    .save-btn:hover { background: #334155; }
    #settings-status { font-size: 9px; color: #22c55e; margin-top: 5px; min-height: 11px; }
    .footer {
      font-size: 9px;
      color: #334155;
      text-align: center;
      margin-top: 12px;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ENGRAM</h1>
    <div id="status-dot" class="dot"></div>
  </div>

  <div class="status-row">
    <div>
      <div class="status-label">Tracking</div>
      <div id="status-text" class="status-value active">Active</div>
    </div>
    <button id="toggle-btn" class="toggle-btn">Pause</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Queued</div>
      <div id="queue-count" class="value">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Threshold</div>
      <div id="threshold-value" class="value" style="font-size:14px">60s</div>
    </div>
  </div>

  <div class="section-title">Recent Captures</div>
  <div class="capture-log" id="capture-log">
    <div class="log-empty">No captures yet — browse to start.</div>
  </div>

  <button id="settings-toggle" class="settings-toggle">⚙ Connection settings</button>
  <div id="settings-panel" class="settings-panel">
    <label for="api-url">Backend URL</label>
    <input id="api-url" type="text" placeholder="http://localhost:8090" spellcheck="false">
    <label for="api-key">API Key</label>
    <input id="api-key" type="password" placeholder="psb-secret-key-...">
    <button id="save-settings" class="save-btn">Save Settings</button>
    <div id="settings-status"></div>
  </div>

  <div class="footer">ENGRAM · Knowledge captured passively</div>
  <script src="popup.js"></script>
</body>
</html>
