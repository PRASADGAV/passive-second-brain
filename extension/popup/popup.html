<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passive Second Brain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 14px; font-weight: 600; }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-label { font-size: 12px; color: #94a3b8; }
    .toggle-btn {
      background: #22c55e;
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: background 0.2s;
    }
    .toggle-btn.paused { background: #ef4444; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .stat-value { color: #38bdf8; font-weight: 600; }
    .settings-toggle {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 11px;
      padding: 4px 0;
      margin-bottom: 4px;
    }
    .settings-toggle:hover { color: #94a3b8; }
    .settings-panel { display: none; }
    .settings-panel.open { display: block; }
    .settings-panel label {
      display: block;
      font-size: 10px;
      color: #94a3b8;
      margin: 8px 0 3px;
    }
    .settings-panel input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 11px;
      padding: 6px 8px;
    }
    .save-btn {
      width: 100%;
      margin-top: 10px;
      background: #334155;
      border: none;
      border-radius: 6px;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 0;
    }
    .save-btn:hover { background: #475569; }
    #settings-status { font-size: 10px; color: #22c55e; margin-top: 6px; min-height: 12px; }
    .footer { font-size: 10px; color: #475569; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 Passive Second Brain</h1>
  </div>

  <div class="status-row">
    <div>
      <div class="status-label">Tracking</div>
      <div id="status-text" style="font-size:13px;font-weight:600;margin-top:2px;">Active</div>
    </div>
    <button id="toggle-btn" class="toggle-btn">Pause</button>
  </div>

  <div class="stat-row">
    <span>Items queued</span>
    <span id="queue-count" class="stat-value">0</span>
  </div>

  <div class="stat-row">
    <span>Reading threshold</span>
    <span id="threshold-value" class="stat-value">60s</span>
  </div>

  <button id="settings-toggle" class="settings-toggle">⚙ Connection settings</button>
  <div id="settings-panel" class="settings-panel">
    <label for="api-url">Backend URL</label>
    <input id="api-url" type="text" placeholder="http://localhost:8090" spellcheck="false">
    <label for="api-key">API Key (X-API-Key)</label>
    <input id="api-key" type="password" placeholder="psb-secret-key-...">
    <button id="save-settings" class="save-btn">Save</button>
    <div id="settings-status"></div>
  </div>

  <div class="footer">Knowledge captured passively — zero effort required.</div>

  <script src="popup.js"></script>
</body>
</html>
